name: Run Zephyr Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zephyr-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_REGISTRY=mcr.microsoft.com
            BASE_IMAGE_TAG=9.0

      - name: Run tests in container
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          docker run --rm \
            -v ${{ github.workspace }}/TestResults:/app/TestResults \
            zephyr-tests:latest

      - name: Show what we produced
        if: always()
        run: |
          echo "=== TestResults contents ==="
          ls -laR TestResults || true
          find . -name '*.trx' -not -path './.git/*' || true

      - name: Stage TRX for git ls-files
        if: always()
        run: git add -f TestResults/*.trx || true

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Zephyr Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-empty: true

      - name: Upload TRX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: TestResults/
          if-no-files-found: warn