name: Run Zephyr Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zephyr-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_REGISTRY=mcr.microsoft.com
            BASE_IMAGE_TAG=10.0

      - name: Run tests in container
        id: run_tests
        continue-on-error: true
        run: |
          set -x
          mkdir -p "${{ github.workspace }}/TestResults"
          chmod -R 0777 "${{ github.workspace }}/TestResults" || true

          docker run --rm \
            -v "${{ github.workspace }}/TestResults:/app/TestResults" \
            zephyr-tests:latest
          echo "docker_exit=$?" | tee -a "$GITHUB_OUTPUT"

      - name: Show produced test artifacts
        if: always()
        run: |
          echo "=== TestResults contents ==="
          ls -laR "${{ github.workspace }}/TestResults" || true
          echo "=== all .trx anywhere (excluding .git) ==="
          find "${{ github.workspace }}" -name '*.trx' -not -path '*/.git/*' || true

      - name: Upload TRX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: ${{ github.workspace }}/TestResults/
          if-no-files-found: warn
          retention-days: 7


      - name: Stage TRX for git ls-files
        if: always()
        run: |
          if compgen -G "${{ github.workspace }}/TestResults/*.trx" > /dev/null; then
            git add -f "${{ github.workspace }}/TestResults/"*.trx
            git status --short
          else
            echo "No TRX files to stage"
          fi

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Zephyr Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-empty: false
          fail-on-error: true

      - name: Fail job if tests failed
        if: always() && steps.run_tests.outputs.docker_exit != '0'
        run: |
          echo "Tests failed with exit code ${{ steps.run_tests.outputs.docker_exit }}"
          exit 1